<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary - Moodly</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="logo">Moodly ♡</a>
    <div class="nav-links">
        <a href="index.html">Beranda</a>
        <a href="diary.html">Diary</a>
        <a href="historyt.html">Riwayat</a>
    </div>
</nav>

<main class="diary-container">

    <div class="diary-header">
        <p class="tagline">DIARY HARIAN</p>
        <h1>Bagaimana perasaanmu <span>hari ini?</span></h1>
        <p>Pilih perasaanmu dan ceritakan apa yang sedang kamu alami.</p>
    </div>

    <div class="mood-grid">

        <button class="mood-button" type="button" data-mood="Senang" data-emoji="😄">
            <span>😄</span><small>Senang</small>
        </button>

        <button class="mood-button" type="button" data-mood="Bahagia" data-emoji="🥰">
            <span>🥰</span><small>Bahagia</small>
        </button>

        <button class="mood-button" type="button" data-mood="Tenang" data-emoji="😌">
            <span>😌</span><small>Tenang</small>
        </button>

        <button class="mood-button" type="button" data-mood="Sedih" data-emoji="😔">
            <span>😔</span><small>Sedih</small>
        </button>

        <button class="mood-button" type="button" data-mood="Lelah" data-emoji="😫">
            <span>😫</span><small>Lelah</small>
        </button>

        <button class="mood-button" type="button" data-mood="Kesal" data-emoji="😡">
            <span>😡</span><small>Kesal</small>
        </button>

    </div>

    <div class="diary-box">
        <label for="ceritaMood">Ceritamu hari ini</label>

        <textarea id="ceritaMood"
            placeholder="Tuliskan apa yang kamu rasakan hari ini..."></textarea>

        <div class="char-count">
            <span id="jumlahKarakter">0</span> karakter
        </div>

        <p id="pesan" class="pesan"></p>

        <button id="tombolSimpan" type="button" class="btn btn-full">
            Simpan Cerita ♡
        </button>
    </div>

    <section class="recent-section">
        <div class="section-heading">
            <h2>Catatan Terakhir</h2>
            <a href="historyt.html">Lihat semua →</a>
        </div>

        <div id="catatanTerbaru"></div>
    </section>

</main>

<footer>
    <p>Moodly ♡ — Terima kasih sudah meluangkan waktu untuk dirimu.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
